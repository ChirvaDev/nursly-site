<ul class="post-list">
  {% assign posts = site.posts %}{% if include.limit %}{% assign posts = site.posts | slice: 0, include.limit %}{% endif %}
  {% for post in posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      <h3>{{ post.title }}</h3>
      {% if post.description %}<p>{{ post.description }}</p>{% endif %}
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%B %-d, %Y' }}</time>
    </a>
  </li>
  {% endfor %}
</ul>

<meta charset="utf-8"><link rel="stylesheet" href="v2.css">
<style>
.g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
.h { text-align: center; font-size: 20px; font-weight: 600; color: var(--muted); }
.h.we { color: var(--accent); }
.c { height: 52px; border-radius: 12px; background: #f6f7fb; }
.c.d { background: var(--sun); } .c.n { background: var(--night); }
.wk { grid-column: 1 / -1; font-size: 19px; font-weight: 600; color: var(--muted); margin: 6px 0 -2px; }
.leg { display: flex; gap: 22px; margin-top: 22px; font-size: 20px; color: var(--muted); }
.leg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 7px; vertical-align: -1px; }
</style>
<div class="f" id="f"><div class="g" id="g"></div>
<div class="leg"><span><i style="background:var(--sun)"></i>Day shift</span><span><i style="background:var(--night)"></i>Night shift</span></div></div>
<script>
var P='NNNNOOODDDONNNOOODDDDOOOOOOO', D=['M','T','W','T','F','S','S'], h='';
D.forEach(function(d,i){ h+='<div class="h'+(i>4?' we':'')+'">'+d+'</div>'; });
for (var w=0; w<4; w++) { h+='<div class="wk">Week '+(w+1)+'</div>'; for (var i=w*7;i<w*7+7;i++) h+='<div class="c'+(P[i]==='D'?' d':P[i]==='N'?' n':'')+'"></div>'; }
document.getElementById('g').innerHTML=h;
</script>

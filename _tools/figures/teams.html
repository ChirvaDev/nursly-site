<meta charset="utf-8"><link rel="stylesheet" href="v2.css">
<style>
.g { display: grid; grid-template-columns: 84px repeat(14, 1fr); gap: 5px; align-items: center; }
.t { font-size: 19px; font-weight: 600; color: var(--muted); }
.c { height: 30px; border-radius: 7px; background: #f6f7fb; }
.d { background: var(--sun); } .n { background: var(--night); }
.sp { grid-column: 1 / -1; height: 10px; }
.leg { display: flex; gap: 22px; margin-top: 22px; font-size: 20px; color: var(--muted); padding-left: 89px; }
.leg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 7px; vertical-align: -1px; }
</style>
<div class="f" id="f"><div class="g" id="g"></div>
<div class="leg"><span><i style="background:var(--sun)"></i>Days</span><span><i style="background:var(--night)"></i>Nights</span></div></div>
<script>
var P='DDOODDDOODDOOO', I=P.slice(7)+P.slice(0,7), h='';
[['Team A',P,'d'],['Team B',I,'d'],0,['Team C',P,'n'],['Team D',I,'n']].forEach(function(r){
  if(!r){h+='<div class="sp"></div>';return;}
  h+='<div class="t">'+r[0]+'</div>'; for(var i=0;i<14;i++) h+='<div class="c'+(r[1][i]==='D'?' '+r[2]:'')+'"></div>';
});
document.getElementById('g').innerHTML=h;
</script>

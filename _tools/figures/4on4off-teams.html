<meta charset="utf-8"><link rel="stylesheet" href="v2.css">
<style>
.g { display: grid; grid-template-columns: 84px repeat(16, 1fr); gap: 4px; align-items: center; }
.t { font-size: 19px; font-weight: 600; color: var(--muted); }
.c { height: 32px; border-radius: 6px; background: #f6f7fb; }
.d { background: var(--sun); } .n { background: var(--night); }
.sp { grid-column: 1 / -1; height: 8px; }
.leg { display: flex; gap: 22px; margin-top: 22px; font-size: 20px; color: var(--muted); padding-left: 88px; }
.leg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 7px; vertical-align: -1px; }
</style>
<div class="f" id="f"><div class="g" id="g"></div>
<div class="leg"><span><i style="background:var(--sun)"></i>Days</span><span><i style="background:var(--night)"></i>Nights</span></div></div>
<script>
var A='DDDDOOOO', B='OOOODDDD', h='';
[['Team A',A,'d'],['Team B',B,'d'],0,['Team C',A,'n'],['Team D',B,'n']].forEach(function(r){
  if(!r){h+='<div class="sp"></div>';return;}
  h+='<div class="t">'+r[0]+'</div>'; for(var i=0;i<16;i++) h+='<div class="c'+(r[1][i%8]==='D'?' '+r[2]:'')+'"></div>';
});
document.getElementById('g').innerHTML=h;
</script>

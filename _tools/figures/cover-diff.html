<meta charset="utf-8"><link rel="stylesheet" href="v2.css">
<style>
.cv { width: 600px; height: 315px; display: grid; place-items: center; background: linear-gradient(180deg, #f5f6ff 0%, #e2e5fe 100%); position: relative; }
.card { width: 380px; background: #fff; border-radius: 22px; padding: 22px 24px; box-shadow: 0 24px 50px -24px rgba(84,104,238,.5); }
.r { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 12px; } .r + .r { margin-top: 14px; }
.bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; background: #f6f7fb; } .bar span { display: block; }
.b { background: var(--base); } .n { background: var(--night); } .w { background: var(--sun); }
.v { font-size: 19px; font-weight: 800; text-align: right; letter-spacing: -0.02em; }
.logo { position: absolute; left: 22px; top: 20px; width: 30px; height: 30px; border-radius: 8px; }
</style>
<div class="cv"><img class="logo" src="icon.jpg"><div class="card">
  <div class="r"><div class="bar"><span class="b" style="width:80%"></span></div><div class="v">$40</div></div>
  <div class="r"><div class="bar"><span class="b" style="width:80%"></span><span class="n" style="width:12%"></span></div><div class="v">$46</div></div>
  <div class="r"><div class="bar"><span class="b" style="width:80%"></span><span class="n" style="width:12%"></span><span class="w" style="width:8%"></span></div><div class="v">$50</div></div>
</div></div>

<meta charset="utf-8"><link rel="stylesheet" href="v2.css">
<style>
.cv { width: 600px; height: 315px; display: grid; place-items: center; background: linear-gradient(180deg, #f5f6ff 0%, #e2e5fe 100%); position: relative; }
.card { width: 380px; background: #fff; border-radius: 22px; padding: 22px 24px; box-shadow: 0 24px 50px -24px rgba(84,104,238,.5); }
.g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; } .g + .g { margin-top: 8px; }
.g i { height: 36px; border-radius: 9px; background: #f3f4fa; display: block; } .g i.on { background: var(--sun); }
.logo { position: absolute; left: 22px; top: 20px; width: 30px; height: 30px; border-radius: 8px; }
</style>
<div class="cv"><img class="logo" src="icon.jpg"><div class="card" id="c"></div></div>
<script>
var P='DDOODDDOODDOOO', h='<div class="g">';
for (var i=0;i<14;i++){ if(i===7) h+='</div><div class="g">'; h+='<i class="'+(P[i]==='D'?'on':'')+'"></i>'; }
document.getElementById('c').innerHTML=h+'</div>';
</script>

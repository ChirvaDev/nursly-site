- q: Is the nurse shift schedule template really free?
  a: Yes. Download, print and share it as much as you like — no email or sign-up needed.
- q: Letter or A4 — which one should I download?
  a: Letter is the standard paper size in the US and Canada, and its weeks start on Sunday. A4 is used in the UK, Australia and most other countries, and its weeks start on Monday.
- q: What's in the 2027 calendar?
  a: A year-at-a-glance page to mark every shift with a code (D, N, E, O, OC, PTO), plus one page for each month with space to write your shift and hours each day, and a box for monthly totals — shifts, hours, night and weekend shifts, overtime, holiday hours and estimated pay.
- q: Can I fill it in on my computer or iPad?
  a: The PDFs are made for printing, but you can also write on them in any PDF app that supports annotations, such as Markup on iPhone and iPad.
- q: How do I make a schedule for a 12-hour rotation?
  a: Use the free 12-hour shift schedule generator to see your Pitman, DuPont or other rotation for the whole year, then copy the shift codes onto the printed calendar — or print the generator's calendar directly.
- q: Is there an app that does this automatically?
  a: Nursly is a shift calendar for iPhone made for nurses. You add shifts in a couple of taps (or generate a whole rotation), and it works out your hours, overtime, differentials and estimated pay for you. You can start free with your first 10 shifts.

# Shown on /nurse-overtime-calculator and as FAQ rich results in Google.
- q: How is a night shift differential calculated?
  a: A percentage differential is added on top of your base rate. For example, a 15% night differential on a $40 base rate makes the night rate $46.00 per hour.
- q: What if I work a night shift on a weekend?
  a: Both differentials apply. With a $40 base, a 15% night and a 10% weekend differential, a weekend night is paid at $40 + $6 + $4 = $50.00 per hour.
- q: How is holiday pay calculated?
  a: This calculator multiplies your full stacked rate (base plus any differentials) by your holiday multiplier — for example 1.5× or 2×.
- q: When does overtime start?
  a: Here overtime starts once your weekly hours pass the threshold you set, usually 40 hours. Hours beyond it are paid at your full stacked rate times your overtime multiplier.
- q: Does this work for UK or Australian nurses?
  a: Yes for the math, as long as your enhancements are a percentage of your base rate — such as unsocial hours or weekend penalty rates. Official NHS Agenda for Change and Australian award rules have their own rates and conditions, so use your pay band or award for exact figures.
- q: Is the tax figure accurate?
  a: It's a flat estimate using the percentage you enter, not a real tax calculation. Your actual tax depends on where you live, your filing status and other income.

# Shown on /pricing and as FAQ rich results in Google.
- q: Is Nursly free?
  a: You can download Nursly for free and add your first 10 shifts at no cost, with your pay rates, overtime and differentials. Nursly Pro unlocks unlimited shifts, detailed earnings analytics, PDF reports, Apple Calendar sync, schedule sharing and custom shift templates. Pro is available as a weekly or yearly subscription, and the yearly plan includes a free trial. Current prices in your local currency are shown in the app before you subscribe.
- q: Does the free version expire?
  a: No. There's no time limit — your first 10 shifts are free and stay in the app for as long as you use it.
- q: What happens after my first 10 shifts?
  a: Everything you've added stays — you can still see those shifts and what they earned. To add more shifts, upgrade to Nursly Pro.
- q: Do I need Pro to calculate my pay?
  a: No. Setting your hourly rate, night and weekend differentials, holiday pay, overtime rules and estimated tax is free. Pro adds unlimited shifts and the extra tools around them.
- q: What's included in Nursly Pro?
  a: Unlimited shifts, detailed earnings analytics, PDF reports for payroll, Apple Calendar sync, schedule sharing and custom shift templates.
- q: Is there a free trial?
  a: Yes. The yearly plan includes a free trial. You won't be charged if you cancel at least 24 hours before the trial ends.
- q: Does the weekly plan have a free trial?
  a: No — the free trial comes with the yearly plan. The weekly plan starts right away and can be cancelled any time.
- q: How much does Nursly Pro cost?
  a: Pro is available as a weekly or a yearly subscription. Prices vary by country, so the current price in your local currency is always shown in the app before you subscribe.
- q: How do I cancel my subscription?
  a: Open iOS Settings → your name → Subscriptions → Nursly. You can cancel any time; you keep Pro until the end of the period you paid for.
- q: What happens to my shifts if I cancel Pro?
  a: Your shifts and earnings history stay on your iPhone. Pro features such as PDF reports, calendar sync and adding new shifts beyond the free limit are locked until you subscribe again.
- q: I already paid. How do I get Pro on a new phone?
  a: Open the Nursly Pro screen in the app and tap Restore Purchases, using the same Apple ID you subscribed with.
- q: Can I get a refund?
  a: Payments are handled by Apple, so refunds are requested from Apple at reportaproblem.apple.com.

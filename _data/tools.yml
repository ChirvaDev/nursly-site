# Free tools — one place for the Guides hub, 404 page and "Related" blocks.
# Add a new tool here and it shows up everywhere. icon = inner SVG (24×24, stroke).
- title: "Overtime & differential calculator"
  url: /nurse-overtime-calculator
  desc: "A week of pay with night, weekend, holiday and overtime rates."
  go: "Open calculator"
  icon: '<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8.5 7.5h7M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 15.5h.01M12 15.5h.01M15.5 15.5h.01"/>'
- title: "12-hour schedule generator"
  url: /12-hour-shift-schedule
  desc: "Pitman, DuPont, 4 on 4 off or your own rotation as a calendar."
  go: "Make a schedule"
  icon: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h2M14 14h2"/>'
- title: "Printable schedule template"
  url: /nurse-shift-schedule-template
  desc: "Free 2027 shift calendar and blank monthly template in PDF."
  go: "Download PDF"
  icon: '<path d="M7 9V3.5h10V9"/><rect x="3.5" y="9" width="17" height="8" rx="2.5"/><path d="M7 14.5h10v6H7z"/>'
